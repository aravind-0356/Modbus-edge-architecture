<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altium Style Schematic (v4 - Final)</title>
    <style>
        body {
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        svg {
            background-color: #ffffff;
            border: 1px solid #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 1100px;
            height: auto;
        }
        .wire { fill: none; stroke: #00008B; stroke-width: 1.5; }
        .comp-body { fill: #FFFFE6; stroke: #00008B; stroke-width: 1.5; }
        .comp-pin { fill: none; stroke: #00008B; stroke-width: 1.5; }
        .junction { fill: #00008B; }
        .text-des { fill: #000000; font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; }
        .text-val { fill: #000000; font-family: 'Arial', sans-serif; font-size: 13px; }
        .text-pin { fill: #000000; font-family: 'Arial', sans-serif; font-size: 11px; }
        .text-net { fill: #00008B; font-family: 'Arial', sans-serif; font-size: 11px; font-style: italic; }
        .tb-line { fill: none; stroke: #000000; stroke-width: 1.5; }
        .tb-text { fill: #000000; font-family: 'Arial', sans-serif; font-size: 12px; }
        .tb-title { fill: #000000; font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; }
        
        /* Alignment helpers */
        .txt-r { text-anchor: end; }
        .txt-c { text-anchor: middle; }
    </style>
</head>
<body>

<svg viewBox="0 0 1100 760">
    <!-- Schematic Grid Background -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="0.8" fill="#D0D0D0"/>
    </pattern>
    <rect x="0" y="0" width="1100" height="760" fill="url(#dotGrid)"/>

    <!-- Sheet Border -->
    <rect x="20" y="20" width="1060" height="720" fill="none" stroke="#000000" stroke-width="2"/>
    <rect x="25" y="25" width="1050" height="710" fill="none" stroke="#000000" stroke-width="1"/>

    <!-- Title Block -->
    <rect x="750" y="635" width="325" height="100" fill="none" stroke="#000000" stroke-width="1.5"/>
    <line x1="750" y1="675" x2="1075" y2="675" class="tb-line"/>
    <line x1="750" y1="705" x2="1075" y2="705" class="tb-line"/>
    <line x1="912" y1="705" x2="912" y2="735" class="tb-line"/>
    <text x="760" y="660" class="tb-title">Modbus-to-Cloud Edge Architecture</text>
    <text x="760" y="695" class="tb-text">Size: A3</text>
    <text x="760" y="725" class="tb-text">Date: 2024-08-20</text>
    <text x="925" y="725" class="tb-text">Revision: 1.0 (Production)</text>

    <!-- ========================================== -->
    <!-- COMPONENTS -->
    <!-- ========================================== -->

    <!-- J1: Mains Terminal Block -->
    <text x="70" y="265" class="text-des txt-c">AC Mains</text>
    <rect x="40" y="280" width="60" height="100" class="comp-body"/>
    <text x="70" y="305" class="text-des txt-c">J1</text>
    <text x="65" y="324" class="text-pin">L</text>
    <text x="65" y="344" class="text-pin">N</text>
    <text x="65" y="364" class="text-pin">PE</text>
    <line x1="100" y1="320" x2="120" y2="320" class="comp-pin"/>
    <line x1="100" y1="340" x2="120" y2="340" class="comp-pin"/>
    <line x1="100" y1="360" x2="120" y2="360" class="comp-pin"/>

    <!-- U1: 24V Power Supply -->
    <rect x="180" y="80" width="160" height="120" class="comp-body"/>
    <text x="260" y="105" class="text-des txt-c">U1</text>
    <text x="260" y="125" class="text-val txt-c">24VDC 5A PSU</text>
    
    <line x1="180" y1="160" x2="160" y2="160" class="comp-pin"/> <text x="188" y="164" class="text-pin">L</text>
    <line x1="180" y1="180" x2="160" y2="180" class="comp-pin"/> <text x="188" y="184" class="text-pin">N</text>
    <line x1="340" y1="140" x2="360" y2="140" class="comp-pin"/> <text x="332" y="144" class="text-pin txt-r">+24V</text>
    <line x1="340" y1="180" x2="360" y2="180" class="comp-pin"/> <text x="332" y="184" class="text-pin txt-r">GND</text>

    <!-- U2: Selec EM2M -->
    <rect x="180" y="380" width="160" height="140" class="comp-body"/>
    <text x="260" y="405" class="text-des txt-c">U2</text>
    <text x="260" y="425" class="text-val txt-c">Selec EM2M-1P</text>
    
    <line x1="180" y1="460" x2="160" y2="460" class="comp-pin"/> <text x="188" y="464" class="text-pin">L</text>
    <line x1="180" y1="480" x2="160" y2="480" class="comp-pin"/> <text x="188" y="484" class="text-pin">N</text>
    <line x1="340" y1="460" x2="360" y2="460" class="comp-pin"/> <text x="332" y="464" class="text-pin txt-r">RS485_A</text>
    <line x1="340" y1="500" x2="360" y2="500" class="comp-pin"/> <text x="332" y="504" class="text-pin txt-r">RS485_B</text>

    <!-- U3: Advantech ADAM-4017+ -->
    <rect x="560" y="340" width="180" height="200" class="comp-body"/>
    <text x="650" y="375" class="text-des txt-c">U3</text>
    <text x="650" y="395" class="text-val txt-c">ADAM-4017+</text>

    <line x1="620" y1="340" x2="620" y2="320" class="comp-pin"/> <text x="620" y="355" class="text-pin txt-c">+Vs</text>
    <line x1="700" y1="340" x2="700" y2="320" class="comp-pin"/> <text x="700" y="355" class="text-pin txt-c">GND</text>
    
    <line x1="560" y1="415" x2="540" y2="415" class="comp-pin"/> <text x="568" y="419" class="text-pin">AI0 (Press)</text>
    <line x1="560" y1="465" x2="540" y2="465" class="comp-pin"/> <text x="568" y="469" class="text-pin">AI1 (Flow)</text>
    
    <line x1="620" y1="540" x2="620" y2="560" class="comp-pin"/> <text x="620" y="532" class="text-pin txt-c">DATA+</text>
    <line x1="700" y1="540" x2="700" y2="560" class="comp-pin"/> <text x="700" y="532" class="text-pin txt-c">DATA-</text>

    <!-- S1 & S2: 4-20mA Sensors -->
    <rect x="440" y="400" width="80" height="30" class="comp-body"/>
    <text x="480" y="420" class="text-val txt-c">Pressure Tx</text>
    <line x1="520" y1="415" x2="540" y2="415" class="comp-pin"/>

    <rect x="440" y="450" width="80" height="30" class="comp-body"/>
    <text x="480" y="470" class="text-val txt-c">Flow Tx</text>
    <line x1="520" y1="465" x2="540" y2="465" class="comp-pin"/>

    <!-- U4: USR-DR404 -->
    <rect x="820" y="340" width="140" height="180" class="comp-body"/>
    <text x="890" y="375" class="text-des txt-c">U4</text>
    <text x="890" y="395" class="text-val txt-c">USR-DR404</text>

    <line x1="860" y1="340" x2="860" y2="320" class="comp-pin"/> <text x="860" y="355" class="text-pin txt-c">+Vs</text>
    <line x1="920" y1="340" x2="920" y2="320" class="comp-pin"/> <text x="920" y="355" class="text-pin txt-c">GND</text>
    
    <line x1="860" y1="520" x2="860" y2="540" class="comp-pin"/> <text x="860" y="512" class="text-pin txt-c">RS485_A</text>
    <line x1="920" y1="520" x2="920" y2="540" class="comp-pin"/> <text x="920" y="512" class="text-pin txt-c">RS485_B</text>
    
    <line x1="960" y1="430" x2="980" y2="430" class="comp-pin"/> <text x="952" y="434" class="text-pin txt-r">RJ45</text>

    <!-- Edge Compute Server -->
    <!-- Removed To Edge Compute text to prevent overlaps -->
    <rect x="980" y="435" width="85" height="30" fill="#FFFFE6" stroke="#00008B" stroke-dasharray="2"/>
    <text x="1022" y="455" class="text-val txt-c">Ledger Server</text>
    <path d="M 980 430 L 1000 430" class="wire" stroke-dasharray="4"/>

    <!-- R1: Termination Resistor -->
    <rect x="364" y="536" width="12" height="8" class="comp-body"/>
    <text x="350" y="545" class="text-val txt-r">R1 120R 1/4W</text>


    <!-- ========================================== -->
    <!-- ROUTING (NETS) -->
    <!-- ========================================== -->

    <!-- AC Mains L (Phase) -->
    <path d="M 120 320 L 130 320 L 130 160 L 160 160" class="wire"/>
    <path d="M 130 320 L 130 460 L 160 460" class="wire"/>
    <circle cx="130" cy="320" r="3" class="junction"/>
    <!-- Text Removed -->

    <!-- AC Mains N (Neutral) -->
    <path d="M 120 340 L 140 340 L 140 180 L 160 180" class="wire"/>
    <path d="M 140 340 L 140 480 L 160 480" class="wire"/>
    <circle cx="140" cy="340" r="3" class="junction"/>
    <!-- Text Removed -->
    
    <!-- AC Mains PE (Earth) -->
    <path d="M 120 360 L 110 360 L 110 400" class="wire"/>
    <!-- Earth Symbol at (110, 400) perfectly centered -->
    <path d="M 100 400 L 120 400 M 104 405 L 116 405 M 108 410 L 112 410" class="wire"/>

    <!-- +24V DC Bus -->
    <path d="M 360 140 L 400 140 L 400 240 L 860 240 L 860 320" class="wire"/>
    <path d="M 620 240 L 620 320" class="wire"/>
    <circle cx="620" cy="240" r="3" class="junction"/>
    <text x="430" y="235" class="text-net">+24VDC</text>

    <!-- GND Bus -->
    <path d="M 360 180 L 380 180 L 380 260 L 920 260 L 920 320" class="wire"/>
    <path d="M 700 260 L 700 320" class="wire"/>
    <circle cx="700" cy="260" r="3" class="junction"/>
    <text x="430" y="255" class="text-net">GND</text>

    <!-- RS485 Data+ (A) Bus -->
    <path d="M 360 460 L 380 460 L 380 580 L 860 580 L 860 540" class="wire"/>
    <path d="M 620 580 L 620 560" class="wire"/>
    <circle cx="620" cy="580" r="3" class="junction"/>
    <circle cx="380" cy="540" r="3" class="junction"/> <!-- Left of R1 -->
    <text x="430" y="575" class="text-net">RS485_A (DATA+)</text>
    
    <!-- RS485 Data- (B) Bus -->
    <path d="M 360 500 L 360 615 L 920 615 L 920 540" class="wire"/>
    <path d="M 700 615 L 700 560" class="wire"/>
    <circle cx="700" cy="615" r="3" class="junction"/>
    <circle cx="360" cy="540" r="3" class="junction"/> <!-- Right of R1 -->
    <text x="430" y="610" class="text-net">RS485_B (DATA-)</text>
    
    <!-- Connect R1 horizontally between the vertical traces -->
    <path d="M 360 540 L 364 540" class="wire"/>
    <path d="M 376 540 L 380 540" class="wire"/>

</svg>

</body>
</html>
