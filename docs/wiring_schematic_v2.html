<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altium Style Schematic (v2)</title>
    <style>
        body {
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        svg {
            background-color: #ffffff;
            border: 1px solid #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 1100px;
            height: auto;
        }
        .wire { fill: none; stroke: #00008B; stroke-width: 1.5; }
        .comp-body { fill: #FFFFE6; stroke: #00008B; stroke-width: 1.5; }
        .comp-pin { fill: none; stroke: #00008B; stroke-width: 1.5; }
        .junction { fill: #00008B; }
        .text-des { fill: #000000; font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; }
        .text-val { fill: #000000; font-family: 'Arial', sans-serif; font-size: 13px; }
        .text-pin { fill: #000000; font-family: 'Arial', sans-serif; font-size: 11px; }
        .text-net { fill: #00008B; font-family: 'Arial', sans-serif; font-size: 11px; font-style: italic; }
        .tb-line { fill: none; stroke: #000000; stroke-width: 1.5; }
        .tb-text { fill: #000000; font-family: 'Arial', sans-serif; font-size: 12px; }
        .tb-title { fill: #000000; font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; }
        
        /* Alignment helpers */
        .txt-r { text-anchor: end; }
        .txt-c { text-anchor: middle; }
    </style>
</head>
<body>

<svg viewBox="0 0 1100 760">
    <!-- Schematic Grid Background -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="0.8" fill="#D0D0D0"/>
    </pattern>
    <rect x="0" y="0" width="1100" height="760" fill="url(#dotGrid)"/>

    <!-- Sheet Border -->
    <rect x="20" y="20" width="1060" height="720" fill="none" stroke="#000000" stroke-width="2"/>
    <rect x="25" y="25" width="1050" height="710" fill="none" stroke="#000000" stroke-width="1"/>

    <!-- Title Block -->
    <rect x="750" y="635" width="325" height="100" fill="none" stroke="#000000" stroke-width="1.5"/>
    <line x1="750" y1="675" x2="1075" y2="675" class="tb-line"/>
    <line x1="750" y1="705" x2="1075" y2="705" class="tb-line"/>
    <line x1="912" y1="705" x2="912" y2="735" class="tb-line"/>
    <text x="760" y="660" class="tb-title">Modbus-to-Cloud Edge Architecture</text>
    <text x="760" y="695" class="tb-text">Size: A3</text>
    <text x="760" y="725" class="tb-text">Date: 2024-08-20</text>
    <text x="925" y="725" class="tb-text">Revision: 1.0 (Production)</text>

    <!-- ========================================== -->
    <!-- COMPONENTS (ENLARGED & RE-SPACED) -->
    <!-- ========================================== -->

    <!-- J1: Mains Terminal Block -->
    <text x="70" y="265" class="text-des txt-c">AC Mains</text>
    <rect x="40" y="280" width="60" height="100" class="comp-body"/>
    <text x="70" y="300" class="text-des txt-c">J1</text>
    <text x="65" y="324" class="text-pin">L</text>
    <text x="65" y="344" class="text-pin">N</text>
    <text x="65" y="364" class="text-pin">PE</text>
    <line x1="100" y1="320" x2="120" y2="320" class="comp-pin"/>
    <line x1="100" y1="340" x2="120" y2="340" class="comp-pin"/>
    <line x1="100" y1="360" x2="120" y2="360" class="comp-pin"/>

    <!-- U1: 24V Power Supply -->
    <rect x="180" y="60" width="160" height="120" class="comp-body"/>
    <text x="260" y="85" class="text-des txt-c">U1</text>
    <text x="260" y="105" class="text-val txt-c">24VDC 5A PSU</text>
    <text x="260" y="125" class="text-val txt-c">DIN Rail</text>
    
    <line x1="180" y1="140" x2="160" y2="140" class="comp-pin"/> <text x="188" y="144" class="text-pin">L</text>
    <line x1="180" y1="160" x2="160" y2="160" class="comp-pin"/> <text x="188" y="164" class="text-pin">N</text>
    <line x1="340" y1="140" x2="360" y2="140" class="comp-pin"/> <text x="332" y="144" class="text-pin txt-r">+24V</text>
    <line x1="340" y1="160" x2="360" y2="160" class="comp-pin"/> <text x="332" y="164" class="text-pin txt-r">GND</text>

    <!-- U2: Selec EM2M -->
    <rect x="180" y="340" width="160" height="140" class="comp-body"/>
    <text x="260" y="365" class="text-des txt-c">U2</text>
    <text x="260" y="385" class="text-val txt-c">Selec EM2M-1P</text>
    <text x="260" y="405" class="text-val txt-c">Modbus ID: 1</text>
    
    <line x1="180" y1="440" x2="160" y2="440" class="comp-pin"/> <text x="188" y="444" class="text-pin">L</text>
    <line x1="180" y1="460" x2="160" y2="460" class="comp-pin"/> <text x="188" y="464" class="text-pin">N</text>
    <line x1="340" y1="440" x2="360" y2="440" class="comp-pin"/> <text x="332" y="444" class="text-pin txt-r">RS485_A</text>
    <line x1="340" y1="460" x2="360" y2="460" class="comp-pin"/> <text x="332" y="464" class="text-pin txt-r">RS485_B</text>

    <!-- U3: Advantech ADAM-4017+ -->
    <rect x="540" y="340" width="180" height="180" class="comp-body"/>
    <text x="630" y="375" class="text-des txt-c">U3</text>
    <text x="630" y="395" class="text-val txt-c">ADAM-4017+</text>
    <text x="630" y="415" class="text-val txt-c">Modbus ID: 2</text>

    <line x1="600" y1="340" x2="600" y2="320" class="comp-pin"/> <text x="600" y="355" class="text-pin txt-c">+Vs</text>
    <line x1="680" y1="340" x2="680" y2="320" class="comp-pin"/> <text x="680" y="355" class="text-pin txt-c">GND</text>
    
    <line x1="540" y1="460" x2="520" y2="460" class="comp-pin"/> <text x="548" y="464" class="text-pin">AI0 (Press)</text>
    <line x1="540" y1="500" x2="520" y2="500" class="comp-pin"/> <text x="548" y="504" class="text-pin">AI1 (Flow)</text>
    
    <line x1="600" y1="520" x2="600" y2="540" class="comp-pin"/> <text x="600" y="512" class="text-pin txt-c">DATA+</text>
    <line x1="680" y1="520" x2="680" y2="540" class="comp-pin"/> <text x="680" y="512" class="text-pin txt-c">DATA-</text>

    <!-- S1 & S2: 4-20mA Sensors -->
    <rect x="420" y="445" width="80" height="30" class="comp-body"/>
    <text x="460" y="465" class="text-val txt-c">Pressure Tx</text>
    <line x1="500" y1="460" x2="520" y2="460" class="comp-pin"/>

    <rect x="420" y="485" width="80" height="30" class="comp-body"/>
    <text x="460" y="505" class="text-val txt-c">Flow Tx</text>
    <line x1="500" y1="500" x2="520" y2="500" class="comp-pin"/>

    <!-- U4: USR-DR404 -->
    <rect x="800" y="340" width="140" height="160" class="comp-body"/>
    <text x="870" y="375" class="text-des txt-c">U4</text>
    <text x="870" y="395" class="text-val txt-c">USR-DR404</text>
    <text x="870" y="415" class="text-val txt-c">Serial Server</text>

    <line x1="840" y1="340" x2="840" y2="320" class="comp-pin"/> <text x="840" y="355" class="text-pin txt-c">+Vs</text>
    <line x1="900" y1="340" x2="900" y2="320" class="comp-pin"/> <text x="900" y="355" class="text-pin txt-c">GND</text>
    
    <line x1="840" y1="500" x2="840" y2="520" class="comp-pin"/> <text x="840" y="492" class="text-pin txt-c">RS485_A</text>
    <line x1="900" y1="500" x2="900" y2="520" class="comp-pin"/> <text x="900" y="492" class="text-pin txt-c">RS485_B</text>
    
    <line x1="940" y1="460" x2="960" y2="460" class="comp-pin"/> <text x="932" y="464" class="text-pin txt-r">RJ45</text>

    <!-- Edge Compute Server -->
    <text x="1000" y="450" class="text-net txt-c">To Edge Compute</text>
    <rect x="960" y="465" width="85" height="30" fill="#FFFFE6" stroke="#00008B" stroke-dasharray="2"/>
    <text x="1002" y="485" class="text-val txt-c">Ledger Server</text>
    <path d="M 960 460 L 1000 460" class="wire" stroke-dasharray="4"/>

    <!-- R1: Termination Resistor -->
    <rect x="376" y="444" width="8" height="12" class="comp-body"/>
    <text x="390" y="455" class="text-val">R1 120R</text>


    <!-- ========================================== -->
    <!-- ROUTING (NETS) -->
    <!-- ========================================== -->

    <!-- AC Mains L (Phase) -->
    <path d="M 120 320 L 140 320 L 140 140 L 160 140" class="wire"/>
    <path d="M 140 320 L 140 440 L 160 440" class="wire"/>
    <circle cx="140" cy="320" r="3" class="junction"/>
    <text x="145" y="290" class="text-net">230VAC_L</text>

    <!-- AC Mains N (Neutral) -->
    <path d="M 120 340 L 120 160 L 160 160" class="wire"/>
    <path d="M 120 340 L 120 460 L 160 460" class="wire"/>
    <circle cx="120" cy="340" r="3" class="junction"/>
    <text x="125" y="375" class="text-net">230VAC_N</text>
    
    <!-- AC Mains PE (Earth) -->
    <path d="M 120 360 L 120 380" class="wire"/>
    <path d="M 110 380 L 130 380 M 114 385 L 126 385 M 118 390 L 122 390" class="wire"/>

    <!-- +24V DC Bus -->
    <path d="M 360 140 L 400 140 L 400 240 L 840 240 L 840 320" class="wire"/>
    <path d="M 600 240 L 600 320" class="wire"/>
    <circle cx="600" cy="240" r="3" class="junction"/>
    <text x="410" y="235" class="text-net">+24VDC</text>

    <!-- GND Bus -->
    <path d="M 360 160 L 380 160 L 380 260 L 900 260 L 900 320" class="wire"/>
    <path d="M 680 260 L 680 320" class="wire"/>
    <circle cx="680" cy="260" r="3" class="junction"/>
    <text x="410" y="255" class="text-net">GND</text>
    
    <!-- NO GND SYMBOL ON U1 AS REQUESTED -->

    <!-- RS485 Data+ (A) Bus -->
    <path d="M 360 440 L 380 440 L 400 440 L 400 580 L 840 580 L 840 520" class="wire"/>
    <path d="M 600 580 L 600 540" class="wire"/>
    <circle cx="600" cy="580" r="3" class="junction"/>
    <circle cx="380" cy="440" r="3" class="junction"/> <!-- Top of R1 -->
    <text x="410" y="575" class="text-net">RS485_A (DATA+)</text>
    
    <!-- RS485 Data- (B) Bus -->
    <path d="M 360 460 L 380 460 L 380 620 L 900 620 L 900 520" class="wire"/>
    <path d="M 680 620 L 680 540" class="wire"/>
    <circle cx="680" cy="620" r="3" class="junction"/>
    <circle cx="380" cy="460" r="3" class="junction"/> <!-- Bot of R1 -->
    <text x="410" y="615" class="text-net">RS485_B (DATA-)</text>

</svg>

</body>
</html>
